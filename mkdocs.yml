site_name: "TIDE"
site_description: "Time-Interpolated Data Engine"
repo_url: https://github.com/NOAA-EMC/TIDE
docs_dir: docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: teal
  features:
    - navigation.tabs

plugins:
  - search
  - mkdoxy:
      projects:
        tide:
          src-dirs: src/
          full-doc: True
          doxy-cfg:
            FILE_PATTERNS: "*.F90 *.cpp *.h"
            RECURSIVE: "YES"
            OPTIMIZE_FOR_FORTRAN: "YES"
            EXTRACT_ALL: "YES"
            GENERATE_HTML: "NO"
            GENERATE_LATEX: "NO"

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.tabbed

