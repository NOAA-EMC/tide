name: TIDE CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Lint: fast checks that don't need the full build environment
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # ─────────────────────────────────────────────────────────────────────────
  # Build and Test: full Docker-based build + test suite
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Print version
        run: echo "TIDE $(cat VERSION)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tide-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check C/C++ formatting (clang-format)
        run: |
          docker run --rm \
            --entrypoint bash \
            tide-test:latest -c "
              find /tide/src /tide/include/tide /tide/tests \
                \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
                ! -path '*/extern/*' ! -path '*/_deps/*' ! -path '*/build/*' \
                -exec clang-format-18 --dry-run --Werror {} + 2>&1 | head -100
            "
        continue-on-error: true  # Advisory until codebase is reformatted

      - name: Run full test suite
        run: |
          docker run --rm \
            --env OMPI_ALLOW_RUN_AS_ROOT=1 \
            --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            tide-test:latest --output-on-failure --timeout 300

      - name: Run MPI tests (2 ranks)
        run: |
          docker run --rm \
            --env OMPI_ALLOW_RUN_AS_ROOT=1 \
            --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            --entrypoint bash \
            tide-test:latest -c "
              cd /tide/build &&
              ctest --output-on-failure --timeout 300 -L mpi -D CTEST_MPIEXEC_MAX_NUMPROCS=2
            "

      - name: Run MPI tests (4 ranks)
        run: |
          docker run --rm \
            --env OMPI_ALLOW_RUN_AS_ROOT=1 \
            --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            --entrypoint bash \
            tide-test:latest -c "
              cd /tide/build &&
              ctest --output-on-failure --timeout 300 -L mpi -D CTEST_MPIEXEC_MAX_NUMPROCS=4
            "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/Testing/
            **/LastTest.log

  # ─────────────────────────────────────────────────────────────────────────
  # Install verification: ensure cmake install works correctly
  # ─────────────────────────────────────────────────────────────────────────
  install-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tide-test:latest
          cache-from: type=gha

      - name: Verify install
        run: |
          docker run --rm \
            --env OMPI_ALLOW_RUN_AS_ROOT=1 \
            --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            --entrypoint bash \
            tide-test:latest -c "
              cmake -S /tide -B /tmp/install-build -G Ninja \
                -DCMAKE_INSTALL_PREFIX=/tmp/tide-install \
                -DCMAKE_PREFIX_PATH=\"\${CMAKE_PREFIX_PATH}\" \
                -DCMAKE_C_COMPILER=gcc-14 \
                -DCMAKE_CXX_COMPILER=g++-14 \
                -DCMAKE_Fortran_COMPILER=gfortran-14 &&
              cmake --build /tmp/install-build -j\$(nproc) &&
              cmake --install /tmp/install-build &&
              echo '--- Installed libraries ---' &&
              find /tmp/tide-install/lib -type f \( -name '*.a' -o -name '*.so*' \) &&
              echo '--- Installed headers ---' &&
              find /tmp/tide-install/include -name '*.hpp' -o -name '*.h' | head -20 &&
              echo '--- Fortran modules ---' &&
              find /tmp/tide-install/include -name '*.mod' &&
              LIB_COUNT=\$(find /tmp/tide-install/lib -type f \( -name '*.a' -o -name '*.so' \) | wc -l) &&
              MOD_COUNT=\$(find /tmp/tide-install/include -name '*.mod' | wc -l) &&
              echo \"Libraries: \$LIB_COUNT, Modules: \$MOD_COUNT\" &&
              [ \"\$LIB_COUNT\" -gt 0 ] && [ \"\$MOD_COUNT\" -gt 0 ]
            "

  # ─────────────────────────────────────────────────────────────────────────
  # Release: tag-triggered Docker image push (optional)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-and-test, install-check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
