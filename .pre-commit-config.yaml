# =============================================================================
# TIDE Pre-commit Hooks Configuration
# =============================================================================
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Update:  pre-commit autoupdate

repos:
  # ─── General file hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict

  # ─── C/C++ formatting ─────────────────────────────────────────────────────
  # Runs inside Docker via CI (see .github/workflows/ci.yml format-check job).
  # To run locally: docker run --rm -v $(pwd):/src tide-test:latest \
  #   find /src/src /src/include /src/tests -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
  #   | xargs clang-format --dry-run --Werror

  # ─── CMake lint (disabled — too strict for existing CMakeLists) ───────────
  # cmake-lint's naming conventions (uppercase macros, etc.) conflict with
  # idiomatic modern CMake patterns used in this project.

  # ─── Python (test data generation scripts) ────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ─── YAML validation ──────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        exclude: ^(\.kiro/|build)

  # ─── Fortran formatting check ─────────────────────────────────────────────
  - repo: https://github.com/pseewald/fprettify
    rev: v0.3.7
    hooks:
      - id: fprettify
        args: [--indent=2, --line-length=132, --diff]
        files: \.(f90|F90)$
        exclude: ^(extern/|build)

  # ─── Shell script linting ──────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
